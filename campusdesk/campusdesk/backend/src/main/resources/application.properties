spring.application.name=campusdesk
server.port=${SERVER_PORT:8080}

# Reads the shared .env of the project (repository root). It is found when the app starts from the root
# folder or from backend/. OS environment variables (docker-compose, IDE run configuration) also work.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# --- PostgreSQL ---
# Docker: docker-compose injects DB_URL/DB_USERNAME/DB_PASSWORD (host "postgres", port 5432).
# Local run (IDE/Gradle): falls back to the compose database published on localhost:5433.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/${POSTGRES_DB:campus_db}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD}}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# --- JWT ---
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:campusdesk}
# 30m = 30 minutes, 8h = 8 hours, 1d = 1 day
security.jwt.expiration=${JWT_EXPIRATION:8h}

# --- CORS: only the frontend origins listed here may call the API ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# --- First administrator (secure provisioning; ADMIN cannot be chosen at registration) ---
app.bootstrap.admin.full-name=${ADMIN_FULL_NAME:System Administrator}
app.bootstrap.admin.email=${ADMIN_EMAIL}
app.bootstrap.admin.password=${ADMIN_PASSWORD}

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=true
