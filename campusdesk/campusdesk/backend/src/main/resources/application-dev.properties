# ===================== DEVELOPMENT CONFIGURATION =====================
# Change these values to match your machine. They are fake, local-only values.

# --- PostgreSQL ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/campusdesk
spring.datasource.username=campusdesk_user
spring.datasource.password=Campus2026db

# "update" creates/updates the tables automatically. Use "validate" if you ran database/schema.sql.
spring.jpa.hibernate.ddl-auto=update

# --- JWT (secret must have 32+ characters) ---
security.jwt.secret=campusdesk-secreto-local-2026-abcdefghijklmnopqrstuvwxyz
security.jwt.issuer=campusdesk
# 30m = 30 minutes, 8h = 8 hours
security.jwt.expiration=8h

# --- CORS: frontend origins allowed to call the API ---
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500

# --- First administrator, created on startup if it does not exist ---
app.bootstrap.admin.full-name=System Administrator
app.bootstrap.admin.email=admin@technova.local
app.bootstrap.admin.password=Admin-Campus-2026!
