# ==============================================================================
# CampusDesk - Orquestación con Docker Compose
# Despliegue con un solo comando: docker compose up -d --build
#
# Puertos expuestos en tu máquina host:
#   - Frontend (Nginx): http://localhost:5500
#   - Backend (Spring Boot): http://localhost:8081 (Swagger: http://localhost:8081/swagger-ui.html)
#   - pgAdmin: http://localhost:5050 (Host en pgAdmin: "postgres", Puerto: 5423 internamente)
#   - PostgreSQL: localhost:5433
# ==============================================================================

services:

  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./carpeta_scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusdesk_backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      # Conexión interna dentro de la red de Docker al contenedor 'postgres' (puerto interno 5432)
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-campusdesk}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-8h}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-System Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: nginx:1.27-alpine
    container_name: campusdesk_frontend
    restart: unless-stopped
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  pgadmin_data:
